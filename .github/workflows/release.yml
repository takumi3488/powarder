name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release binary
        shell: bash
        run: nimble build -d:release -y

      - name: Sanity check binary
        shell: bash
        run: ./powarder --version

      - name: Sign and notarize macOS binary
        if: matrix.target == 'darwin-arm64'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_BASE64:?APPLE_CERTIFICATE_BASE64 is required}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD is required}"
          : "${APPLE_SIGNING_IDENTITY:?APPLE_SIGNING_IDENTITY is required}"
          : "${APPLE_NOTARY_APPLE_ID:?APPLE_NOTARY_APPLE_ID is required}"
          : "${APPLE_NOTARY_PASSWORD:?APPLE_NOTARY_PASSWORD is required}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"

          keychain_password="$(openssl rand -hex 16)"
          keychain_path="${RUNNER_TEMP}/powarder-signing.keychain-db"
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          notary_zip="${RUNNER_TEMP}/powarder-notary.zip"
          cleanup() {
            security delete-keychain "${keychain_path}" >/dev/null 2>&1 || true
            rm -f "${certificate_path}" "${notary_zip}"
          }
          trap cleanup EXIT

          printf '%s' "${APPLE_CERTIFICATE_BASE64}" | base64 -D >"${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -s "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}"

          codesign --force --options runtime --timestamp \
            --sign "${APPLE_SIGNING_IDENTITY}" ./powarder
          codesign --verify --strict --verbose=2 ./powarder

          ditto -c -k --keepParent ./powarder "${notary_zip}"
          # `--wait` alone polls forever, so a backed-up notary queue holds the
          # job until the 6h limit and leaves the release neither published nor
          # failed. Bound the wait and fail loudly instead; re-run the workflow
          # once the notary service catches up.
          xcrun notarytool submit "${notary_zip}" \
            --apple-id "${APPLE_NOTARY_APPLE_ID}" \
            --password "${APPLE_NOTARY_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait --timeout 45m
          spctl --assess --type execute --verbose=4 ./powarder

      - name: Attest release binary
        uses: actions/attest@v4
        with:
          subject-path: ./powarder
      - name: Create archive
        shell: bash
        run: tar czf powarder-${{ matrix.target }}.tar.gz powarder

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: powarder-${{ matrix.target }}
          path: powarder-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # `workflow_dispatch` runs from a branch, where `GITHUB_REF_NAME` is a
    # branch name rather than a version tag. Publishing a release makes no
    # sense there (and the version check below would always fail), so a manual
    # run only exercises the build matrix.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify tag matches powarder.nimble version
        shell: bash
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          nimble_version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' powarder.nimble)
          echo "Tag version:    ${tag_version}"
          echo "nimble version: ${nimble_version}"
          if [ "${tag_version}" != "${nimble_version}" ]; then
            echo "::error::Tag version (${tag_version}) does not match powarder.nimble version (${nimble_version})"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: sha256sum powarder-*.tar.gz > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            dist/powarder-*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
