# powarder — project-wide compilation settings
#
# Adding src/ to the search path lets both the implementation and the tests
# reference modules as `import powarder/core/types`.
#
# `nimble test` automatically passes `--path:<root>/src`, but running `nim c
# -r tests/tfoo.nim` directly does not. If import syntax differed between the
# two, the same module could resolve to different paths, so this keeps them
# consistent.
--path:"$config/src"
